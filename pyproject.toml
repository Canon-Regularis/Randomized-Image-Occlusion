[build-system]
# Stated rather than left to pip's legacy fallback, which is what an absent
# [build-system] table silently selects for `pip install -e .`.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "randomized-image-occlusion"
version = "1.2.0"
description = "Anki add-on: image occlusion that randomises label placement each review."
readme = "README.md"
# 3.9, because that is what Anki bundles. Anki shipped Python 3.9.18 from 23.10
# (this add-on's min_point_version) until 25.07, which was the first release on
# 3.13. Anything newer than 3.9 in the shipped package makes the add-on fail to
# LOAD on every Anki in between; `@dataclass(slots=True)` did exactly that. The
# CI `check` job runs 3.9 and tests/test_python_floor.py imports every module, so
# a too-new construct is caught rather than shipped.
requires-python = ">=3.9"
license = { file = "LICENSE" }

# This project is distributed as an Anki add-on (.ankiaddon), not a PyPI wheel.
# The dependencies below are only needed for development/testing.
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]
# Anki's own libraries (`aqt`, `anki`) exist only inside Anki at runtime, so CI
# does NOT install them — mypy uses `ignore_missing_imports` instead. Install
# this extra locally (`pip install -e ".[anki]"`) ONLY if you want your editor to
# resolve `from aqt import ...` / `from anki import ...` and offer autocomplete;
# it is never required to run the tests. (It pulls PyQt6, so it's a large install.)
anki = ["aqt>=23.10", "anki>=23.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# mutate.py is a table of code fragments quoted verbatim from the files it
# mutates. They have to match the source byte for byte, so wrapping them to fit
# a line limit would make them harder to read against the original and easier to
# get subtly — and silently — wrong.
"mutate.py" = ["E501"]

[tool.mypy]
# 3.10, not the 3.9 floor in `requires-python`: mypy follows Python's EOL and
# refuses to target 3.9 ("must be 3.10 or higher"). The floor is enforced instead
# by the CI `check` job, which runs the suite on a real 3.9 interpreter, and by
# tests/test_python_floor.py, which imports every shipped module there.
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true   # aqt/anki are not installed in CI
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
