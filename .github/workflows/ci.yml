name: CI

# Verify every push to main and every pull request; also runnable on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch/PR cancels the in-flight run — no wasted minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here needs write access to the repo.
permissions:
  contents: read

jobs:
  # Lint, type-check, and the Python suite on the MINIMUM supported interpreter.
  # These gates are version-agnostic, so ruff/mypy run here exactly once; the
  # `pytest` job below adds cross-version runtime coverage without repeating them.
  check:
    name: lint · types · tests (py3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The floor Anki actually gives us: it bundled Python 3.9 from 23.10
          # (this add-on's min_point_version) until 25.07. A construct newer than
          # this makes the add-on fail to LOAD, which no other job would notice.
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev tooling
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint + import order)
        run: ruff check --output-format=github .
      - name: Mypy (static types)
        run: mypy
      - name: Pytest
        run: python -m pytest -q

  # Cross-version safety net: the Python suite on the other supported interpreters
  # (lint/types are version-agnostic and already covered by `check`, so skipped).
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Up to 3.13, which is what Anki 25.07 and later bundle, so the
        # interpreter most users are actually on is covered.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install pytest
      - run: python -m pytest -q

  # The reviewer renderer is inlined JS; its determinism/geometry invariants are
  # tested with Node's built-in runner — no npm dependencies to install.
  js:
    name: js renderer tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every JS suite is reachable by the runner
        # `node --test tests/js/*.test.js` runs one flat pattern. Node 21+ treats
        # the argument as a glob, so a pattern matching nothing is zero tests and
        # exit 0 - a silently green job. And the pattern is narrower than node's
        # own discovery: a suite in a subdirectory, or named `.spec.js`, would
        # never run. Compare the pattern against every suite in the tree.
        run: |
          expected=$(find tests -name '*.test.js' -o -name '*.spec.js' | sort)
          actual=$(ls -1 tests/js/*.test.js | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::JS suites exist that the runner would not run"
            echo "the runner covers:"
            echo "$actual"
            echo "the tree contains:"
            echo "$expected"
            exit 1
          fi
          echo "$actual" | wc -l
      - run: node --test tests/js/*.test.js

  # Green suites are not the same as suites that would go red. This runs the
  # catalogue in `mutate.py`: it breaks one piece of logic at a time and fails if
  # nothing notices, which is how a test that only executes code — rather than
  # depending on it — gets caught. Needs both toolchains, since the catalogue
  # covers the editor canvas as well as the Python modules.
  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    # The only job whose cost grows with the catalogue: one child process per
    # mutation, ~7-10 min for 185 on a 2-vCPU runner. Headroom, not a target.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e ".[dev]"
      - run: python mutate.py

  # Only after every check is green: package the .ankiaddon and publish it as a
  # build artifact, so a reviewer can install the exact reviewed build from any PR.
  build:
    name: build .ankiaddon
    needs: [check, pytest, js, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the add-on (stdlib only)
        run: python build.py
      - name: Upload the .ankiaddon
        uses: actions/upload-artifact@v4
        with:
          name: randomized_occlusion-ankiaddon
          path: dist/randomized_occlusion.ankiaddon
          if-no-files-found: error
          retention-days: 30
